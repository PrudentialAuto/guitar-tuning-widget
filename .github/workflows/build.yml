name: Build Guitar Tuner Widget APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitar-tuner-widget-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Commit APK to repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "APK files found:"
          find app/build/outputs -name "*.apk" | tee /tmp/apk_list.txt
          APK_FILE=$(head -1 /tmp/apk_list.txt)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found"; exit 1
          fi
          mkdir -p release
          cp "$APK_FILE" release/guitar-tuner-widget-debug.apk
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add release/guitar-tuner-widget-debug.apk
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "CI: Add built debug APK [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"${GITHUB_REF_NAME}"
